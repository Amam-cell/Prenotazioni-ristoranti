<!DOCTYPE html>
<html lang="it">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Prenotazioni Ristorante</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 24px;
      color: var(--text);
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    label {
      font-size: 14px;
      color: var(--text-muted);
    }
    input, select {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: var(--text);
      font-size: 16px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }
    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: var(--primary-hover);
    }
    .booking-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .booking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg);
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 10px;
    }
