<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracciamento Coperti Ristoranti - Reception</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1, h2 {
            color: var(--text-main);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 10px 12px;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-dark);
        }

        .btn-danger {
            background-color: var(--danger);
            width: auto;
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.95rem;
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
        }

        .restaurant-management {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .restaurant-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tag {
            background-color: #334155;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tag button {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-weight: bold;
            padding: 0;
            width: auto;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .summary-box {
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .summary-box h3 {
            margin: 0 0 8px 0;
            font-size: 1rem;
            color: var(--text-muted);
        }

        .summary-box .pax-count {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--success);
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Gestione Coperti Ristoranti</h1>
        <p style="color: var(--text-muted); margin-top: -10px;">Tracciamento interno per chiusura contabile mensile</p>

        <!-- Sezione Gestione Ristoranti Partner -->
        <div class="card">
            <h2>Ristoranti Partner</h2>
            <div class="restaurant-tags" id="restaurantTags">
                <!-- Generati dinamicamente -->
            </div>
            <div class="restaurant-management">
                <input type="text" id="newRestaurantName" placeholder="Nome nuovo ristorante...">
                <button type="button" onclick="addRestaurant()" style="width: 180px;">Aggiungi</button>
            </div>
        </div>

        <!-- Form Inserimento Invio Ospite -->
        <div class="card">
            <h2>Registra Invio Ospite</h2>
            <form id="bookingForm" onsubmit="submitBooking(event)">
                <div class="form-group">
                    <label>Data Invio</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label>Ristorante Partner</label>
                    <select id="restaurantSelect" required>
                        <!-- Generati dinamicamente -->
                    </select>
                </div>
                <div class="form-group">
                    <label>N° Camera</label>
                    <input type="text" id="room" placeholder="Es. 204" required>
                </div>
                <div class="form-group">
                    <label>Nome Ospite</label>
                    <input type="text" id="guest" placeholder="Es. Rossi" required>
                </div>
                <div class="form-group">
                    <label>N° Coperti (PAX)</label>
                    <input type="number" id="pax" min="1" value="2" required>
                </div>
                <div class="form-group">
                    <label>Orario</label>
                    <input type="time" id="time" required>
                </div>
                <div class="form-group">
                    <label>Note / Tipo (Opz.)</label>
                    <input type="text" id="notes" placeholder="Es. Lato Ristorante">
                </div>
                <button type="submit">Salva in Lista Interna</button>
            </form>
        </div>

        <!-- Riepilogo Totali per Mese -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <h2 style="margin: 0;">Totale Coperti per Mese</h2>
                <div style="width: 200px;">
                    <input type="month" id="filterMonth" onchange="renderBookings()">
                </div>
            </div>
            <div class="summary-grid" id="monthlySummary">
                <!-- Generato dinamicamente -->
            </div>
        </div>

        <!-- Riepilogo Tabellare -->
        <div class="card">
            <h2>Registro Invii / Prenotazioni</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Data</th>
                            <th>Ristorante</th>
                            <th>Camera</th>
                            <th>Ospite</th>
                            <th>PAX</th>
                            <th>Orario</th>
                            <th>Note</th>
                            <th>Azioni</th>
                        </tr>
                    </thead>
                    <tbody id="bookingsTableBody">
                        <!-- Dati dinamici -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let bookings = [];
        let restaurants = [];

        const today = new Date();
        document.getElementById('date').valueAsDate = today;
        document.getElementById('filterMonth').value = today.toISOString().slice(0, 7);

        socket.on('init', (data) => {
            bookings = data.bookings || [];
            restaurants = data.restaurants || [];
            renderRestaurants();
            renderBookings();
        });

        function renderRestaurants() {
            const select = document.getElementById('restaurantSelect');
            const tagsContainer = document.getElementById('restaurantTags');
            
            select.innerHTML = '';
            tagsContainer.innerHTML = '';

            restaurants.forEach(rest => {
                const opt = document.createElement('option');
                opt.value = rest;
                opt.textContent = rest;
                select.appendChild(opt);

                const tag = document.createElement('div');
                tag.className = 'tag';
                tag.innerHTML = `${escapeHtml(rest)} <button onclick="deleteRestaurant('${rest}')" title="Elimina">&times;</button>`;
                tagsContainer.appendChild(tag);
            });
        }

        function addRestaurant() {
            const input = document.getElementById('newRestaurantName');
            const name = input.value.trim();
            if (name && !restaurants.includes(name)) {
                socket.emit('add_restaurant', name);
                input.value = '';
            }
        }

        function deleteRestaurant(name) {
            if (confirm(`Vuoi eliminare il ristorante "${name}" e tutte le relative prenotazioni?`)) {
                socket.emit('delete_restaurant', name);
            }
        }

        function submitBooking(e) {
            e.preventDefault();
            const newBooking = {
                date: document.getElementById('date').value,
                restaurant: document.getElementById('restaurantSelect').value,
                room: document.getElementById('room').value,
                guest: document.getElementById('guest').value,
                pax: parseInt(document.getElementById('pax').value),
                time: document.getElementById('time').value,
                notes: document.getElementById('notes').value
            };

            bookings.push(newBooking);
            socket.emit('update_bookings', bookings);
            
            document.getElementById('room').value = '';
            document.getElementById('guest').value = '';
            document.getElementById('notes').value = '';
        }

        function deleteBooking(id) {
            bookings = bookings.filter(b => b._id !== id);
            socket.emit('update_bookings', bookings);
        }

        function renderBookings() {
            const tbody = document.getElementById('bookingsTableBody');
            const summaryContainer = document.getElementById('monthlySummary');
            const selectedMonth = document.getElementById('filterMonth').value;
            
            tbody.innerHTML = '';
            summaryContainer.innerHTML = '';

            const filteredBookings = bookings.filter(b => {
                if (!b.date) return false;
                return b.date.startsWith(selectedMonth);
            });

            const totalsByRestaurant = {};
            restaurants.forEach(r => totalsByRestaurant[r] = 0);

            filteredBookings.forEach(b => {
                if (totalsByRestaurant[b.restaurant] !== undefined) {
                    totalsByRestaurant[b.restaurant] += (b.pax || 0);
                } else {
                    totalsByRestaurant[b.restaurant] = (b.pax || 0);
                }
            });

            Object.keys(totalsByRestaurant).forEach(rest => {
                const totalPax = totalsByRestaurant[rest];
                const box = document.createElement('div');
                box.className = 'summary-box';
                box.innerHTML = `
                    <h3>${escapeHtml(rest)}</h3>
                    <p class="pax-count">${totalPax} <span style="font-size: 1rem; color: var(--text-muted);">PAX</span></p>
                `;
                summaryContainer.appendChild(box);
            });

            filteredBookings.sort((a, b) => new Date(b.date) - new Date(a.date));

            if (filteredBookings.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--text-muted);">Nessuna prenotazione registrata per questo mese.</td></tr>';
                return;
            }

            filteredBookings.forEach(b => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${escapeHtml(b.date)}</td>
                    <td><strong>${escapeHtml(b.restaurant)}</strong></td>
                    <td>${escapeHtml(b.room)}</td>
                    <td>${escapeHtml(b.guest)}</td>
                    <td>${b.pax}</td>
                    <td>${escapeHtml(b.time)}</td>
                    <td>${escapeHtml(b.notes || '')}</td>
                    <td><button class="btn-danger" onclick="deleteBooking('${b._id}')">Rimuovi</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
