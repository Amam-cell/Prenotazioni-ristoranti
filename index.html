<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Concierge & F&B - Gestione Coperti Partner</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
      --tag-pizzeria: #d97706;
      --tag-ristorante: #2563eb;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    header p {
      color: var(--text-muted);
      margin-top: 6px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .grid-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background-color: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      box-sizing: border-box;
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover { opacity: 0.9; }

    .inline-group {
      display: flex;
      gap: 10px;
    }

    .restaurant-sections {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .restaurant-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .restaurant-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .restaurant-title {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .booking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .booking-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .booking-main {
      font-weight: 600;
      font-size: 1rem;
    }

    .booking-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .tag {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      display: inline-block;
      margin-left: 8px;
    }

    .tag-ristorante { background-color: var(--tag-ristorante); color: white; }
    .tag-pizzeria { background-color: var(--tag-pizzeria); color: white; }

    .btn-delete {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 6px 12px;
      font-size: 0.85rem;
    }
    .btn-delete:hover { background: var(--danger); color: white; }

    .btn-secondary {
      background-color: #334155;
      font-size: 0.9rem;
      padding: 10px 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Rendicontazione Coperti Partner</h1>
      <p>Controllo flussi e prenotazioni ristoranti esterni</p>
    </header>

    <!-- SEZIONE GESTIONE RISTORANTI PARTNER -->
    <div class="card">
      <h3 style="margin-top:0; font-size:1.1rem;">Aggiungi o Gestisci Ristoranti Partner</h3>
      <div class="inline-group">
        <input type="text" id="newRestoName" placeholder="Nome nuovo ristorante...">
        <button type="button" class="btn-secondary" onclick="addRestaurant()">Aggiungi Ristorante</button>
      </div>
    </div>

    <!-- FORM NUOVA PRENOTAZIONE -->
    <div class="card">
      <h3 style="margin-top:0; font-size:1.1rem;">Nuova Prenotazione Ospite</h3>
      <form id="bookingForm" class="grid-form">
        <div>
          <label for="restaurant">Ristorante Partner</label>
          <select id="restaurant" required>
            <!-- Caricato dinamicamente -->
          </select>
        </div>

        <div>
          <label for="guestName">Nome Ospite</label>
          <input type="text" id="guestName" placeholder="Es. Rossi / Smith" required>
        </div>

        <div>
          <label for="roomNumber">Numero Camera</label>
          <input type="text" id="roomNumber" placeholder="Es. 104" required>
        </div>

        <div>
          <label for="pax">N° Coperti (Persone)</label>
          <input type="number" id="pax" min="1" max="50" value="2" required>
        </div>

        <div>
          <label for="time">Orario</label>
          <input type="time" id="time" required>
        </div>

        <div>
          <label for="areaType">Area / Servizio</label>
          <select id="areaType">
            <option value="Standard">Standard / Generico</option>
            <option value="Lato Ristorante">Lato Ristorante</option>
            <option value="Lato Pizzeria">Lato Pizzeria</option>
          </select>
        </div>

        <div class="full-width">
          <button type="submit">Invia Prenotazione al Locale</button>
        </div>
      </form>
    </div>

    <!-- ELENCO PRENOTAZIONI E TOTALI PER FATTURAZIONE -->
    <div id="displayArea" class="restaurant-sections">
      <!-- Generato dinamicamente via JS -->
    </div>
  </div>

  <script>
    const socket = io();
    let currentBookings = [];
    let currentRestaurants = [];

    const form = document.getElementById('bookingForm');
    const displayArea = document.getElementById('displayArea');
    const restoSelect = document.getElementById('restaurant');

    socket.on('init', (data) => {
      currentBookings = data.bookings;
      currentRestaurants = data.restaurants;
      render();
    });

    function addRestaurant() {
      const input = document.getElementById('newRestoName');
      const name = input.value.trim();
      if (name) {
        socket.emit('add_restaurant', name);
        input.value = '';
      }
    }

    window.deleteRestaurant = function(name) {
      if (confirm(`Vuoi rimuovere il ristorante "${name}" e tutte le prenotazioni collegate?`)) {
        socket.emit('delete_restaurant', name);
      }
    };

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const newBooking = {
        id: Date.now().toString(),
        restaurant: restoSelect.value,
        guestName: document.getElementById('guestName').value,
        roomNumber: document.getElementById('roomNumber').value,
        pax: document.getElementById('pax').value,
        time: document.getElementById('time').value,
        areaType: document.getElementById('areaType').value
      };

      currentBookings.push(newBooking);
      socket.emit('update_bookings', currentBookings);
      form.reset();
    });

    window.deleteBooking = function(id) {
      currentBookings = currentBookings.filter(b => b.id !== id);
      socket.emit('update_bookings', currentBookings);
    };

    function render() {
      // Aggiorna select ristoranti nel form
      restoSelect.innerHTML = currentRestaurants.map(r => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('');

      displayArea.innerHTML = '';

      if (currentRestaurants.length === 0) {
        displayArea.innerHTML = '<div class="card" style="text-align:center; color: var(--text-muted);">Nessun ristorante configurato. Aggiungine uno sopra.</div>';
        return;
      }

      currentRestaurants.forEach(resto => {
        const items = currentBookings.filter(b => b.restaurant === resto);
        const totalPax = items.reduce((sum, i) => sum + parseInt(i.pax || 0), 0);
        
        let html = `
          <div class="restaurant-card">
            <div class="restaurant-header">
              <div>
                <span class="restaurant-title">${escapeHtml(resto)}</span>
                <span style="display:block; color: var(--text-muted); font-size: 0.85rem; margin-top:2px;">Totale Coperti Mese/Oggi: <strong>${totalPax} PAX</strong></span>
              </div>
              <button class="btn-delete" style="padding:4px 8px; font-size:0.75rem;" onclick="deleteRestaurant('${escapeHtml(resto)}')">Elimina Locale</button>
            </div>
        `;

        if (items.length === 0) {
          html += `<div style="color: var(--text-muted); font-size: 0.9rem; padding: 6px 0;">Nessuna prenotazione attiva per questo partner.</div>`;
        } else {
          items.forEach(b => {
            let tagClass = '';
            if (b.areaType === 'Lato Ristorante') tagClass = 'tag-ristorante';
            if (b.areaType === 'Lato Pizzeria') tagClass = 'tag-pizzeria';
            const tagHtml = tagClass ? `<span class="tag ${tagClass}">${b.areaType}</span>` : '';

            html += `
              <div class="booking-item">
                <div class="booking-details">
                  <div class="booking-main">
                    Cam. ${escapeHtml(b.roomNumber)} - ${escapeHtml(b.guestName)} (${b.pax} pax) ${tagHtml}
                  </div>
                  <div class="booking-sub">
                    🕒 Orario: <strong>${b.time}</strong>
                  </div>
                </div>
                <button class="btn-delete" onclick="deleteBooking('${b.id}')">Rimuovi</button>
              </div>
            `;
          });
        }

        html += `</div>`;
        displayArea.innerHTML += html;
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
